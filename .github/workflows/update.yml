name: Update predictions

on:
  schedule:
    - cron: "17 * * * *"   # hourly (GitHub often delays scheduled runs, so ask often)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore results cache
        uses: actions/cache@v6
        with:
          path: data
          key: results-${{ github.run_id }}
          restore-keys: results-
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build predictions
        run: python -m pipeline.build
      - name: Check before publishing
        run: python -m pipeline.check
      - name: Smoke test the built site
        run: python -m pipeline.smoke site
      - name: Version asset links (cache-busting)
        run: python -m pipeline.stamp site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
